
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SchemaGuard</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="auth-wrapper">

        <section class="form-container">

            <!-- Brand -->
            <div style="text-align: center; margin-bottom: 28px;">

                <h1 style="color: var(--primary); margin-bottom: 8px;">
                    SchemaGuard
                </h1>

                <h2>Welcome Back</h2>

                <p>
                    Sign in to access your data quality dashboard.
                </p>

            </div>

            <!-- Login Form -->
            <form action="#" method="post">

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control"
                        placeholder="Enter your email"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <!-- Remember Me and Forgot Password -->
                <div class="flex-between mb-4">

                    <div class="flex-center gap-2">
                        <input
                            type="checkbox"
                            id="remember-me"
                            name="remember-me"
                        >

                        <label for="remember-me" style="margin: 0;">
                            Remember me
                        </label>
                    </div>

                    <a href="#" style="font-size: 13px;">
                        Forgot password?
                    </a>

                </div>

                <!-- Login Button -->
                <button
                    type="submit"
                    name="login"
                    class="btn btn-primary"
                    style="width: 100%;"
                >
                    Sign In
                </button>

            </form>

            <!-- Registration Link -->
            <div style="text-align: center; margin-top: 24px;">

                <p>
                    Don't have an account?
                    <a href="register.html">Create an account</a>
                </p>

            </div>

            <hr>

            <!-- Footer -->
            <div style="text-align: center; margin-top: 18px;">
                <small>SchemaGuard © 2026. All rights reserved.</small>
            </div>

        </section>

    </main>

</body>

</html>
